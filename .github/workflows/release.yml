name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF_NAME}"
          out="deployer-${GOOS}-${GOARCH}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/${out}" .
          ( cd dist && tar -czf "${out}.tar.gz" "${out}" && shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256" )

      - uses: actions/upload-artifact@v7
        with:
          name: deployer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/deployer-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/deployer-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v6
        with:
          path: repo

      - name: Stage install script
        run: cp repo/scripts/install.sh dist/install.sh

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/install.sh
          generate_release_notes: true
